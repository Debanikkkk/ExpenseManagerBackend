services:
  postgres:
    image: postgres:16
    container_name: expense-manager-postgres
    environment:
      POSTGRES_DB: expense_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - expense-manager-postgres-data:/var/lib/postgresql/data

volumes:
  expense-manager-postgres-data: